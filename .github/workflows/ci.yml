# CI (EVE-19): typecheck, lint, every self-check, the production build and the cross-tenant isolation
# test (EVE-23), once per pull request (whatever its base — stacked PRs target each other's branches)
# and on every push to master. Master takes changes only through a PR whose five jobs are green.
#
# A push to a PR's branch used to run everything TWICE: `push` on every branch plus `pull_request`,
# in two concurrency groups (PR #2 review). Third-party actions are pinned to a commit, not a moving
# tag — the tag each SHA was read from is beside it.
#
# No secrets: nothing here reaches Neon, Vercel or R2. The build gets dummy values for the two
# variables it needs just to construct the auth module — it never connects to anything.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run checks

  # Studio B calls every server action with studio A's ids (EVE-23), against a throwaway Postgres
  # of Neon's major version that lives only for this job.
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: eve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eve:eve@localhost:5432/eve
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:verify:isolation
      - run: npm run db:verify:signup

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-build-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The client chunks' size in the log; fails on the old isMain guard or a check message in a chunk
      # (EVE-54 — a backstop: the source guard is check:check-files in the checks job).
      - run: npm run bundle:report -- --fail-on-checks
